<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Rudra B. Joshi — Nuclear systems and space-themed banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0b0d17"/>
      <stop offset="1" stop-color="#14102b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaffd9"/>
      <stop offset="0.35" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-duration: 4.2s; animation-delay: -1s; }
    .s3 { animation-duration: 2.4s; animation-delay: -2s; }
    .s4 { animation-duration: 5s; animation-delay: -3s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }

    .pulse { transform-origin: 730px 150px; animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(.85); opacity: .8; } 50% { transform: scale(1.25); opacity: 1; } }

    .ring { fill: none; stroke: #4cc9f0; stroke-opacity: .45; stroke-width: 1.5; }
    .spin { transform-origin: 730px 150px; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .rocket { font-size: 30px; animation: fly 9s linear infinite; }
    @keyframes fly {
      0%   { transform: translate(-60px, 280px) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(520px, 20px) rotate(0deg); opacity: 0; }
    }

    .title { font-family: 'Courier New', monospace; font-weight: 700; font-size: 52px; fill: url(#title); animation: flicker 6s infinite; }
    @keyframes flicker { 0%,92%,100% { opacity: 1; } 94% { opacity: .55; } 96% { opacity: 1; } 98% { opacity: .7; } }

    .sub { font-family: 'Courier New', monospace; font-size: 17px; letter-spacing: 4px; fill: #4cc9f0; }
    .tag { font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px; fill: #39ff14; }
    .cursor { fill: #39ff14; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(310px); } }
  </style>

  <!-- background -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <circle cx="160" cy="70" r="170" fill="url(#nebula)"/>
  <circle cx="780" cy="260" r="150" fill="url(#nebula)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="40" cy="30" r="1.4"/>
    <circle class="star s2" cx="95" cy="120" r="1"/>
    <circle class="star s3" cx="150" cy="40" r="1.6"/>
    <circle class="star s4" cx="210" cy="250" r="1.2"/>
    <circle class="star" cx="260" cy="90" r="1"/>
    <circle class="star s2" cx="330" cy="20" r="1.5"/>
    <circle class="star s3" cx="380" cy="270" r="1"/>
    <circle class="star s4" cx="430" cy="60" r="1.3"/>
    <circle class="star" cx="480" cy="230" r="1.1"/>
    <circle class="star s2" cx="540" cy="35" r="1.6"/>
    <circle class="star s3" cx="590" cy="280" r="1"/>
    <circle class="star s4" cx="620" cy="110" r="1.2"/>
    <circle class="star" cx="860" cy="40" r="1.5"/>
    <circle class="star s2" cx="880" cy="170" r="1"/>
    <circle class="star s3" cx="835" cy="285" r="1.3"/>
    <circle class="star s4" cx="20" cy="210" r="1.2"/>
    <circle class="star" cx="70" cy="275" r="1"/>
    <circle class="star s2" cx="590" cy="190" r="1.1"/>
    <circle class="star s3" cx="690" cy="25" r="1.4"/>
    <circle class="star s4" cx="815" cy="95" r="1"/>
  </g>

  <!-- atom -->
  <g>
    <circle class="pulse" cx="730" cy="150" r="46" fill="url(#core)"/>
    <circle cx="730" cy="150" r="11" fill="#39ff14" filter="url(#glow)"/>

    <g transform="translate(730 150) rotate(0)">
      <ellipse class="ring" rx="100" ry="34"/>
      <circle r="5" fill="#4cc9f0" filter="url(#glow)">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M-100,0 a100,34 0 1,0 200,0 a100,34 0 1,0 -200,0"/>
      </circle>
    </g>
    <g transform="translate(730 150) rotate(60)">
      <ellipse class="ring" rx="100" ry="34"/>
      <circle r="5" fill="#ff9f1c" filter="url(#glow)">
        <animateMotion dur="4.1s" repeatCount="indefinite" path="M-100,0 a100,34 0 1,0 200,0 a100,34 0 1,0 -200,0"/>
      </circle>
    </g>
    <g transform="translate(730 150) rotate(120)">
      <ellipse class="ring" rx="100" ry="34"/>
      <circle r="5" fill="#f72585" filter="url(#glow)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M-100,0 a100,34 0 1,0 200,0 a100,34 0 1,0 -200,0"/>
      </circle>
    </g>

    <!-- slow outer dashed ring -->
    <g class="spin">
      <circle cx="730" cy="150" r="125" fill="none" stroke="#39ff14" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 10"/>
    </g>
  </g>

  <!-- rocket -->
  <text class="rocket" x="0" y="0">🚀</text>

  <!-- text -->
  <text class="title" x="40" y="140">RUDRA B. JOSHI</text>
  <text class="sub" x="42" y="178">NUCLEAR SYSTEMS · SPACE · CODE</text>
  <text class="tag" x="42" y="222">&gt; MISSION CONTROL: ONLINE</text>
  <rect class="cursor" x="296" y="209" width="9" height="16"/>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#4cc9f0" opacity=".08"/>

  <!-- frame -->
  <rect x="1" y="1" width="898" height="298" fill="none" stroke="#4cc9f0" stroke-opacity=".35" stroke-width="2" rx="10"/>
</svg>
